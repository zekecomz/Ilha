<script>
const N=96,TS=16,C=N/2,cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H,Z,DPR=1;
function rs(){Z=Math.max(2,Math.round(Math.min(innerWidth,innerHeight)/190));cv.width=Math.ceil(innerWidth/Z);cv.height=Math.ceil(innerHeight/Z);W=cv.width;H=cv.height;g.imageSmoothingEnabled=false;document.getElementById('m').style.top=(66*Z)+'px'}
addEventListener('resize',rs);rs();
const hs=(x,y)=>{const h=Math.sin(x*127.1+y*311.7+7.3)*43758.5453;return h-Math.floor(h)};
const vn=(x,y,s)=>{x/=s;y/=s;const x0=Math.floor(x),y0=Math.floor(y),fx=x-x0,fy=y-y0,sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy),a=hs(x0,y0),b=hs(x0+1,y0),c=hs(x0,y0+1),d=hs(x0+1,y0+1);return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy};

// ---- mapa: 0 água 1 areia 2 grama 3 pedra 4 caminho 5 solo arado | objetos: 1 árvore 2 rocha 3 mercado
const t=new Uint8Array(N*N),o=new Uint8Array(N*N),hp=new Uint8Array(N*N),crops=new Map();
for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  const dx=x-C,dy=y-C,td=Math.hypot(dx,dy),d=td/C,land=1-d*.95+(vn(x,y,12)-.5)*.6,i=y*N+x;let ty;

  else if(td>14&&vn(x+50,y+50,8)>.68)ty=0;

  t[i]=ty;
  if(ty==2&&td>8&&vn(x+99,y,7)>.5&&hs(x,y)<.4)o[i]=1;
  if(ty==3&&hs(x*3,y)<.3)o[i]=2;
  if(o[i])hp[i]=3;
}
o[(C-2)*N+C+2]=3;
const STALL={x:(C+2)*TS+8,y:(C-2)*TS+8};

const P={x:C*TS+8,y:C*TS+14,dir:2,fr:0,an:0,hp:100,hu:100,en:100,coins:0,tool:0,cd:0,sw:0,hit:0,T:0,day:1,inv:{wood:0,stone:0,crop:0,seed:5},lv:[1,1,1,1,1,1,1]};

const K={},DX=[0,1,0,-1],DY=[-1,0,1,0],TOOLS=['Mac','Pic','Enx','Sem','Reg','Esp','Con'],NAMES=['Machado','Picareta','Enxada','Semente','Regador/Pesca','Espada'];
const BL=[{n:'Cerca',w:2,s:0,o:4},{n:'Muro',w:0,s:3,o:5},{n:'Casa',w:10,s:4,o:6},{n:'Torre',w:6,s:8,o:7}],cost=b=>(b.w?b.w+' mad ':'')+(b.s?b.s+' ped':'');
let bi=0,beams=[];
const note=s=>{msg=s;msgT=4};
try{const s=JSON.parse(localStorage.getItem('vni')||'null');if(s){Object.assign(P,s.p);t.set([...s.t].map(Number));o.set([...s.o].map(Number));hp.fill(3);s.cr.forEach(([k,v])=>crops.set(k,v))}}catch(e){}
function save(){try{localStorage.setItem('vni',JSON.stringify({p:{x:P.x,y:P.y,hp:P.hp,hu:P.hu,en:P.en,coins:P.coins,inv:P.inv,T:P.T,day:P.day,lv:P.lv,sh:P.sh,own:P.own,q:P.q,pr:P.pr,xp:P.xp,lvl:P.lvl,cv:P.cv,sec:P.sec},t:Array.from(t).join(''),o:Array.from(o).join(''),cr:[...crops]}))}catch(e){}}

let ready=false,ENT=null,PT=null;
const inCave=()=>P.x<24*TS&&P.y<24*TS;
function carve(){
  for(let y=3;y<=22;y++)for(let x=3;x<=22;x++){const i=y*N+x;t[i]=8;o[i]=0;hp[i]=0;
    if(x>=5&&x<=20&&y>=5&&y<=20){t[i]=7;const r=hs(x*5+1,y*3+2);if(r<.2&&!(Math.abs(x-12)<2&&(y>=19||Math.abs(y-12)<2))){o[i]=r<.06?8:2;hp[i]=o[i]==8?4:3}}}
  t[20*N+12]=6;let best=-1,bd=1e9;
  for(let y=26;y<N-3;y++)for(let x=26;x<N-3;x++){const i=y*N+x;if(t[i]==3&&!o[i]&&[[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>t[i+b*N+a]==2||t[i+b*N+a]==1)){const d=Math.hypot(x-C,y-C);if(d<bd){bd=d;best=i}}}
  if(best<0)best=(C-12)*N+C+12;t[best]=6;o[best]=0}
function scan(){ENT=PT=null;for(let y=0;y<N;y++)for(let x=0;x<N;x++){const v=t[y*N+x];if(v==6&&(x>24||y>24))ENT={x,y};if(v==10&&!(x>=70&&y>=70))PT={x,y}}}
function secret(){if(P.sec)return;P.sec=1;
  for(let y=70;y<=90;y++)for(let x=70;x<=90;x++){const d=Math.hypot(x-80,y-80),i=y*N+x;if(d<=8){t[i]=d>6.5?1:2;o[i]=0;if(ready)paint(i)}}

  if(ready){paint(86*N+80);paint(C*N+x);const q=MM.getContext('2d');for(let i=0;i<N*N;i++){q.fillStyle=COL[t[i]];q.fillRect(i%N,i/N|0,1,1)}}}

// ---- chão pré-renderizado

let PM=0;
function paint(i){const x=i%N,y=i/N|0,ty=t[i],X=x*TS,Y=y*TS;m.fillStyle=COL[ty];m.fillRect(X,Y,TS,TS);m.fillStyle=DET[ty];
  for(let k=0;k<5;k++)m.fillRect(X+((hs(x*7+k,y*3+k*5)*TS)|0),Y+((hs(y+k,x*5)*TS)|0),2,1);
  if(ty==2||ty==7){m.fillStyle='#78c85c';for(let k=0;k<3;k++)m.fillRect(X+((hs(x+k,y*9)*14)|0)+1,Y+((hs(y+k,x*4)*12)|0)+3,1,2)}
  else if(ty==1){m.fillStyle='#f4e6b4';for(let k=0;k<2;k++)m.fillRect(X+((hs(x*2+k,y)*14)|0),Y+((hs(y*2+k,x)*14)|0),1,1)}}
function paintOld(i){const x=i%N,y=i/N|0,ty=t[i];if(PM!=2){m.fillStyle=COL[ty];m.fillRect(x*TS,y*TS,TS,TS)}m.fillStyle=DET[ty];
  if(PM!=2){m.fillStyle=hs(x*3,y*5)>.5?'rgba(255,255,255,.06)':'rgba(0,0,0,.06)';m.fillRect(x*TS,y*TS,TS,TS)}if(PM==1)return;m.fillStyle=DET[ty];
  for(let k=0;k<7;k++){const px=x*TS+hs(x*7+k,y*3+k*5)*TS,py=y*TS+hs(y+k,x*5+k)*TS,r=.5+hs(k,x+y)*.9;m.beginPath();m.ellipse(px,py,r*1.4,r,0,0,6.3);m.fill()}
  if(ty==2||ty==7){m.strokeStyle=DET[ty];m.lineWidth=.6;for(let k=0;k<4;k++){const px=x*TS+hs(x+k,y*9)*TS,py=y*TS+hs(y+k,x*4)*TS+2;m.beginPath();m.moveTo(px,py);m.lineTo(px+(hs(k,y)-.5)*2,py-2.2);m.stroke()}}}
PM=1;for(let i=0;i<N*N;i++)paint(i);
function smoothM(){const T2=document.createElement('canvas');T2.width=M.width;T2.height=M.height;const q=T2.getContext('2d');q.filter='blur(3px)';q.drawImage(M,0,0);q.filter='none';m.save();m.setTransform(1,0,0,1,0,0);m.globalAlpha=1;m.drawImage(T2,0,0);m.globalAlpha=1;m.restore()}
PM=0;

// ---- sprites
let parts=[];
function held(x,y,d,sw){const T=P.tool,t=performance.now()/1000,p=sw>0?1-sw/.25:0,BA=[0,1.5708,3.1416,-1.5708][d],FA=[-1.5708,0,1.5708,3.1416][d];
  let hx=d==3?-5:5,hy=-7+(sw>0?0:Math.round(Math.sin(t*4)*.6)),a;
  if(P.lt!==T){P.lt=T;P.eqt=performance.now()}const eq=(performance.now()-(P.eqt||0))/250;if(eq<1)hy-=Math.round(Math.sin(eq*3.1416)*4);
  if(sw>0){const e=Math.sin(p*3.1416);hx+=DX[d]*4*e;hy+=DY[d]*4*e;a=BA+(-1.1+2.2*p)}
  else a=(d==1?.6:d==3?-.6:d==2?.3:-.3)+Math.sin(t*3)*.07;
  g.save();g.translate(x+hx,y+hy);g.rotate(a);
  const R=(c,u,v,w,h)=>{g.fillStyle=c;g.fillRect(u,v,w,h)};
  if(T==0){R('#8b5a2b',-1,-10,2,11);R('#cfd3da',-3,-11,6,4);R('#fff8',-3,-11,6,1)}
  else if(T==1){R('#8b5a2b',-1,-10,2,11);R('#cfd3da',-5,-11,10,2);R('#cfd3da',-5,-9,2,2);R('#cfd3da',3,-9,2,2)}
  else if(T==2){R('#8b5a2b',-1,-10,2,11);R('#cfd3da',-1,-11,5,2);R('#cfd3da',3,-11,2,4)}
  else if(T==3){R('#c8a060',-3,-6,6,6);R('#7ac943',-1,-9,2,3);R('#5a3a1e',-1,-4,2,1)}
  else if(T==4){R('#59f',-3,-6,7,6);R('#8cf',3,-8,4,3);R('#fff6',-3,-6,7,1)}
  else if(T==5){R('#eee',-1,-13,2,11);R('#fff',-1,-13,1,11);R('#c9b27a',-3,-3,6,2);R('#8b5a2b',-1,-1,2,3)}
  else{R('#8b5a2b',-1,-8,2,9);R('#7a7a86',-4,-11,8,4)}
  g.restore();
  if(sw>0&&T==5){g.strokeStyle='rgba(255,255,255,.65)';g.lineWidth=2;g.beginPath();g.arc(x,y-7,12,FA-1.1,FA-1.1+2.2*p);g.stroke();g.lineWidth=1}}
function fx(i,T){const cx=(i%N)*TS+8,cy=(i/N|0)*TS+8;let c=null;
  if(T==0&&o[i]==1)c=['#8b5a2b','#c8a060'];else if(T==1&&o[i]==2)c=['#bbb','#ffe066'];else if(T==2&&t[i]==2&&!o[i])c=['#6b4a2c','#9a7449'];
  else if(T==4&&(t[i]==0||crops.get(i)))c=['#8cf','#59f'];else if(T==3&&t[i]==5)c=['#7ac943','#c8a060'];
  if(c)for(let k=0;k<8;k++)parts.push({x:cx,y:cy,vx:(Math.random()-.5)*50,vy:-Math.random()*40-10,t:.45,c:c[k%c.length]})}
function chrS(x,y,d,f,sw){x=Math.round(x);y=Math.round(y);if(sw>0){const l=Math.sin((1-sw/.25)*3.1416)*2;x+=Math.round(DX[d]*l);y+=Math.round(DY[d]*l)}
  const tt=performance.now()/1000,mv=f>0,ph=mv?Math.sin(P.an*3.1416):0,bob=mv?-Math.abs(ph)*.9:Math.sin(tt*3)*.25,
  rr=(a,b,w,h,r,c)=>{g.fillStyle=c;g.beginPath();if(g.roundRect)g.roundRect(x+a,y+b,w,h,r);else g.rect(x+a,y+b,w,h);g.fill()},
  ci=(a,b,r,c)=>{g.fillStyle=c;g.beginPath();g.arc(x+a,y+b,r,0,6.3);g.fill()},
  sd=(c,k)=>{const n=parseInt(c.slice(1),16);return'rgb('+Math.min(255,(n>>16)*k|0)+','+Math.min(255,(n>>8&255)*k|0)+','+Math.min(255,(n&255)*k|0)+')'},
  SK='#ffd9b0',SKD='#e8b98e',HR='#4a2f1b',HRL='#6b4528',SC=SH[P.sh||0],PN='#34406e',BT='#5a3b22',BP='#9a6a3a',eyh=(tt%4>3.85)?.15:.95;
  g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(x,y-1,6,2.2,0,0,6.3);g.fill();
  if(d==0)held(x,y,d,sw);
  const ey=(a,b)=>{g.fillStyle='#1d1d2b';g.beginPath();g.ellipse(x+a,y+b,.7,eyh,0,0,6.3);g.fill();if(eyh>.5)ci(a+.2,b-.4,.25,'#fff')};
  if(d==2||d==0){
    const lf=Math.max(0,ph)*1.6,rf=Math.max(0,-ph)*1.6,a1=ph*1.6;
    rr(-3.8,-7,3,5.6-lf,1.2,PN);rr(-4.1,-2.5-lf,3.6,2.5,1.2,BT);rr(.8,-7,3,5.6-rf,1.2,PN);rr(.5,-2.5-rf,3.6,2.5,1.2,BT);
    rr(-4.6,-13+bob,9.2,7.4,2.2,SC);rr(-4.6,-8.4+bob,9.2,2.8,1.4,sd(SC,.82));rr(-4.6,-7.4+bob,9.2,1,.4,'#3b2a1a');
    if(d==0){rr(-3.6,-12.6+bob,7.2,6.6,1.6,BP);rr(-3.6,-12.6+bob,7.2,2.2,1.2,sd(BP,.8))}else rr(-3.6,-12.6+bob,3,1.4,.7,sd(SC,1.2));
    rr(-6.8,-12.2+bob-a1*.4,2.3,6,1.1,sd(SC,.92));ci(-5.6,-6+bob-a1*.4,1.2,SK);
    rr(4.5,-12.2+bob+a1*.4,2.3,6,1.1,sd(SC,.92));ci(5.6,-6+bob+a1*.4,1.2,SK);

    else{ci(0,-16.4+bob,4.9,HR);ci(0,-17.2+bob,5,HR);rr(-2.4,-19.8+bob,2.6,.8,.4,HRL)}

    rr(-1.5+lx,-7,3,5.6,1.2,sd(PN,.8));rr(-1.7+lx+s*.6,-2.5,3.6,2.5,1.2,sd(BT,.85));
    rr(-1.5-lx,-7,3,5.6,1.2,PN);rr(-1.7-lx+s*.6,-2.5,3.6,2.5,1.2,BT);
    rr(-3.5,-13+bob,7,7.4,2.2,SC);rr(-3.5,-8.4+bob,7,2.8,1.4,sd(SC,.82));rr(-3.5,-7.4+bob,7,1,.4,'#3b2a1a');
    rr(-1.2+ax,-12.2+bob,2.4,6,1.2,SC);ci(ax,-6+bob,1.2,SK);
    ci(-s*.8,-17+bob,4.8,HR);ci(-s*.5,-15.6+bob,3.6,HR);ci(s*.4,-15.6+bob,4.3,SK);ci(-s*.4,-15.6+bob,1,SKD);
    rr(s>0?-2.4:-4.1,-20.4+bob,6.5,3.2,1.6,HR);rr(s>0?-1.4:-1.2,-19.8+bob,2.6,.8,.4,HRL);
    ey(s*2.2,-15.4+bob);ci(s*4.6,-14.6+bob,.7,SKD);ci(s*2.8,-13.9+bob,.7,'rgba(255,120,120,.3)')}
  if(d!=0)held(x,y,d,sw)}
function chr(x,y,d,f,sw){x=Math.round(x);y=Math.round(y);if(sw>0){const l=Math.sin((1-sw/.25)*3.1416)*2;x+=Math.round(DX[d]*l);y+=Math.round(DY[d]*l)}
  const R=(c,a,b,w,h)=>{g.fillStyle=c;g.fillRect(x+a,y+b,w,h)},SK='#ffdbac',HR='#3c2819',lo=f==1?1:0,ro=f==2?1:0;
  R('#0004',-4,-2,8,2);if(d==0)held(x,y,d,sw);
  R('#323c6e',-3,-6-lo,2,3);R('#50321e',-3,-3-lo,2,2);R('#323c6e',1,-6-ro,2,3);R('#50321e',1,-3-ro,2,2);
  R(SH[P.sh||0],-4,-11,8,5);
  if(d%2==0){R(SK,-5,-10,1,4);R(SK,4,-10,1,4)}else R(SK,-1,-10,2,4);
  R(SK,-3,-16,6,5);

  let a=0;if(P.T>=840&&P.T<900)a=(P.T-840)/60*.55;else if(P.T>=900&&P.T<1170)a=.55;else if(P.T>=1170)a=(1200-P.T)/30*.55;
  if(rain()&&!inCave())a=Math.max(a,.25);if(inCave())a=.42;
  if(a>0){g.fillStyle='rgba(10,10,50,'+a+')';g.fillRect(0,0,W,H)}
  
  
  if(rain()&&!inCave()){g.fillStyle='#9cf8';for(let k=0;k<70;k++)g.fillRect(Math.random()*W,Math.random()*H,1,4)}
  // interface
  hud1();quest();
  const h=P.T<900?6+P.T/900*13:19+(P.T-900)/300*11,hh=Math.floor(h%24),mm=Math.floor(h%1*60);
  const r=s=>g.measureText(s).width;
  const s1='Dia '+P.day+'  '+String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0')+(night()?' ☾':' ☀'),s2='Moedas: '+P.coins;
  hud2(s1,s2);
  const sw=20,bx=Math.round(W/2-sw*3.5);
  for(let k=0;k<0;k++){g.fillStyle=k==P.tool?'#fffc':'#000a';g.fillRect(bx+k*sw,H-24,sw-2,sw-2);
    tx(TOOLS[k],bx+k*sw+1,H-18,k==P.tool?'#000':'#fff');g.fillStyle='#000';if(k==3)tx(''+P.inv.seed,bx+k*sw+2,H-26,'#9f9');}
  const lb=P.tool==6?'Construir: '+BL[bi].n+' ('+cost(BL[bi])+') [Q]':NAMES[P.tool]+' Nv'+P.lv[P.tool]+(P.tool==0||P.tool==1||P.tool==5?' [U melhora]':'');
  const iv='Mad '+P.inv.wood+'  Ped '+P.inv.stone+'  Col '+P.inv.crop+'  Pei '+(P.inv.fish||0);hotbar(lb,iv);
  if(msgT>0){pnl(Math.round(W/2-r(msg)/2)-4,40,r(msg)+8,12);tx(msg,Math.round(W/2-r(msg)/2),42,'#fff')}
  else if(P.day==1&&P.T<60)tx('WASD mover · Espaço agir · 1-7 ferramentas · Q tipo · U melhora',4,H-74);
}
ready=true;let last=performance.now();
(function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;if(innerWidth>=innerHeight&&!paus&&!shopOpen)update(dt);draw();requestAnimationFrame(loop)})(last);
if(P.day==1&&P.T<5)note('Bem-vindo à ilha! Corte árvores, plante e sobreviva à noite.');
</script></body></html>
